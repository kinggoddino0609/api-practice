<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>마이 헬스 로그</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============ LOGIN / SIGNUP SCREEN ============ -->
<section class="screen is-active" id="view-auth">
  <div class="login-wrap">
    <div>
      <div class="brand-mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M2 13h4l2-7 4 14 3-9 2 5h5" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>마이 헬스 로그</span>
      </div>
      <form class="login-card" id="auth-form" novalidate>
        <h1 class="display" id="auth-title">다시 오셨네요</h1>
        <p class="sub" id="auth-sub">오늘의 기록을 남기러 로그인하세요</p>

        <div class="form-msg" id="auth-msg"></div>

        <div class="field">
          <label for="auth-email">이메일</label>
          <input id="auth-email" type="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="auth-password">비밀번호</label>
          <input id="auth-password" type="password" required minlength="8" autocomplete="current-password" />
        </div>
        <button class="btn-primary" type="submit" id="auth-submit">로그인</button>
        <p class="login-foot">
          <span id="auth-toggle-text">계정이 없으신가요?</span>
          <a href="#" id="auth-toggle-link">회원가입</a>
        </p>
      </form>
    </div>
  </div>
</section>

<!-- ============ DASHBOARD SCREEN ============ -->
<section class="screen" id="view-dashboard">
  <div class="shell">
    <div class="topbar">
      <div class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M2 13h4l2-7 4 14 3-9 2 5h5" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <strong>마이 헬스 로그</strong>
      </div>
      <div class="user-chip">
        <span id="current-email"></span>
        <button type="button" id="logout-btn">로그아웃</button>
      </div>
    </div>

    <p class="eyebrow" id="today-label">오늘의 요약</p>
    <div class="stat-row" id="stat-row">
      <!-- JS로 채워짐 -->
    </div>

    <div class="grid-2">
      <div class="panel form-panel">
        <div class="form-panel-head">
          <h2>기록 추가</h2>
          <button class="btn-primary btn-compact" type="submit" form="record-form">기록 저장</button>
        </div>
        <div class="form-msg" id="record-msg"></div>
        <form id="record-form">
          <div class="form-grid">
            <div class="field full">
              <label for="rf-date">날짜</label>
              <input id="rf-date" type="date" required />
            </div>
            <div class="field">
              <label for="rf-weight">체중 (kg)</label>
              <input id="rf-weight" type="number" step="0.1" min="1" required />
            </div>
            <div class="field">
              <label for="rf-height">키 (cm)</label>
              <input id="rf-height" type="number" step="0.1" min="1" required />
            </div>
            <div class="field-row-3">
              <div class="field">
                <label for="rf-systolic">수축기 혈압</label>
                <input id="rf-systolic" type="number" min="1" required />
              </div>
              <div class="field">
                <label for="rf-diastolic">이완기 혈압</label>
                <input id="rf-diastolic" type="number" min="1" required />
              </div>
              <div class="field">
                <label for="rf-sugar">공복혈당</label>
                <input id="rf-sugar" type="number" min="0" required />
              </div>
            </div>
            <div class="field-row-2">
              <div class="field">
                <label for="rf-steps">걸음 수</label>
                <input id="rf-steps" type="number" min="0" value="0" />
              </div>
              <div class="field">
                <label for="rf-sleep">수면 시간</label>
                <input id="rf-sleep" type="number" step="0.1" min="0" value="0" />
              </div>
            </div>
            <div class="field full">
              <label for="rf-memo">메모</label>
              <input id="rf-memo" type="text" />
            </div>
          </div>
        </form>
      </div>

      <div class="panel">
        <div class="panel-head" style="padding-bottom: 14px;">
          <h2>최근 기록</h2>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>날짜</th>
                <th class="num">체중</th>
                <th class="num">BMI</th>
                <th class="num">혈압</th>
                <th class="num">혈당</th>
                <th>상태</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="records-tbody">
              <!-- JS로 채워짐 -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>체중 추이</h2>
        <span class="delta mono" id="trend-delta"></span>
      </div>
      <div class="chart-wrap" id="chart-wrap">
        <canvas id="trend-weight" height="90"></canvas>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>혈압 추이</h2>
        <div class="chart-legend">
          <span class="legend-item"><i style="background: var(--accent);"></i>수축기</span>
          <span class="legend-item"><i style="background: var(--ink-400);"></i>이완기</span>
        </div>
      </div>
      <div class="chart-wrap" id="chart-wrap-bp">
        <canvas id="trend-bp" height="90"></canvas>
      </div>
    </div>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
